# Used by docker/dev.sh. GPU settings live in compose.gpu.yaml, which dev.sh adds
# only when the NVIDIA container runtime is installed, so the same setup runs on
# a laptop without a GPU (robot control is CPU-only).
#
# Hardware access notes:
#   - SocketCAN interfaces live in the host network namespace, hence
#     network_mode: host. This only reaches the real host under *rootful*
#     Docker; rootless Docker's "host" network is rootlesskit's namespace and
#     can0/can1 are invisible there (docker/dev.sh warns about this).
#   - /dev is bind-mounted with a cgroup rule for V4L2 (major 81) so the UVC
#     camera can be unplugged/replugged without restarting the container.
#   - NET_ADMIN lets scripts/setup_can.sh bring CAN links up from inside;
#     SYS_NICE lets the control thread request SCHED_FIFO (best effort; set
#     hardware.realtime_priority > 0 in configs/task_config.yaml).
name: robotokens

services:
  dev:
    image: robotokens-deploy:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
        VISION: ${ROBOTOKENS_VISION:-0}        # 1 = torch + GroundingDINO + SAM2 (requirements-vision.txt)
        TORCH_INDEX_URL: ${ROBOTOKENS_TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
    device_cgroup_rules:
      - "c 81:* rmw"
    # USER uid:gid in the Dockerfile drops supplementary groups; re-add them so the
    # non-root user can open /dev/video* (camera) and serial adapters.
    group_add:
      - video
      - dialout
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    environment:
      DISPLAY: ${DISPLAY:-}
    ipc: host
    network_mode: host
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: sleep infinity
