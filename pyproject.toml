[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robotokens"
version = "0.1.0"
description = "Mapping human egocentric vision and hand tracking to bimanual OpenArms robot control via RobotBlockSet (RBS) and MuJoCo"
readme = "README.md"
authors = [{ name = "RoboTokens Hackathon Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pyyaml>=6.0",
    "mujoco>=3.6.0",
    "mink>=0.0.11",
    "daqp>=0.6.0",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
rbs = [
    "robotblockset>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
