[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robotokens"
version = "0.1.0"
description = "Mapping human egocentric vision and hand tracking to bimanual OpenArms robot control via RobotBlockSet (RBS) and MuJoCo"
readme = "README.md"
authors = [{ name = "RoboTokens Hackathon Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pyyaml>=6.0",
    "mujoco>=3.2.0",
    # Differential IK on the official OpenArm MuJoCo model (src/planning/openarm_ik.py).
    "mink>=0.0.11",
    "daqp>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
# Real-robot I/O: official OpenArm SocketCAN SDK Python binding, built from the
# pinned upstream tag (needs cmake + a C++17 compiler; Linux only).
hardware = [
    "openarm_can @ git+https://github.com/enactic/openarm_can.git@1.4.0#subdirectory=python ; sys_platform == 'linux'",
]
rbs = [
    "robotblockset>=0.2.0",
    "ompl>=2.0.0",
]
# Object localization: GroundingDINO (text-prompted detection) + SAM2 (segmentation).
# torch/torchvision are NOT listed here -- install separately with the CUDA index
# matching your GPU, e.g. for Blackwell (RTX 50-series):
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
vision = [
    "opencv-contrib-python>=4.9.0",
    "groundingdino-py @ git+https://github.com/IDEA-Research/GroundingDINO.git",
    "sam2 @ git+https://github.com/facebookresearch/sam2.git",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
