# Task Configuration for DaiDai Lab Egocentric Vision -> RBS / MuJoCo OpenArms

task:
  name: "daidai_bimanual_openarms_teleop"
  version: "1.0.0"
  description: "Egocentric hand tracking teleoperation and motion planning for bimanual OpenArms"

# Vision & Egocentric Stream Parameters
vision:
  source: "hbv_hd_camera" # options: "mock", "hbv_hd_camera", "opencv", "stream"
  camera_device: "HBV HD CAMERA" # Model ID: UVC Camera 0x0ac8:0x0346
  device_index: 1 # Typically 1 on macOS (0 is MacBook camera)
  width: 1280
  height: 720
  fps: 30
  pixel_format: "uyvy422" # or "bgr0"
  rotate_180: true # Set true if egocentric clip mounts camera inverted
  stream_uri: "tcp://127.0.0.1:5555"
  confidence_threshold: 0.65
  smoothing:
    filter_type: "exponential" # "exponential" or "butterworth"
    alpha: 0.75 # Lower = smoother, higher = more responsive
  
  # Coordinate Mapping (Human Egocentric -> Robot Base Frame)
  mapping:
    # Scale from human hand motion (meters) to robot workspace
    scale_factor: 1.2
    # Coordinate system mapping: [x_rob, y_rob, z_rob] from [x_cam, y_cam, z_cam]
    # Standard: Camera (X: right, Y: down, Z: forward) -> Robot (X: fwd, Y: left, Z: up)
    axis_permutation: [2, 0, 1]  # x_rob = z_cam, y_rob = -x_cam, z_rob = -y_cam
    axis_signs: [1.0, -1.0, -1.0]
    # Calibration nominal offsets in robot base frame (meters)
    left_nominal_offset: [0.35, 0.18, 0.55]
    right_nominal_offset: [0.35, -0.18, 0.55]

# Planning Parameters (RobotBlockSet & OMPL)
planning:
  planner_type: "RRTConnect" # RRTConnect, BKPIECE1, PRM, BiTRRT
  max_planning_time_sec: 0.15
  collision_clearance: 0.015 # meters
  interpolation_steps: 25
  goal_tolerance_cartesian: 0.01 # 1 cm
  goal_tolerance_orientation: 0.05 # radians
  asynchronous_replanning: true
  min_cartesian_delta_for_replan: 0.03 # 3 cm trigger

# Robot Safety & Kinematic Limits
safety:
  cartesian_bounds:
    x_min: 0.15
    x_max: 0.55
    y_min: -0.45
    y_max: 0.45
    z_min: 0.38 # Above table surface
    z_max: 0.75
  max_joint_velocity_rad_s: 2.5
  max_cartesian_velocity_m_s: 0.6
  min_bimanual_ee_distance: 0.08 # Minimum distance between left and right end-effectors (meters)

# Simulation & Execution Rates
simulation:
  # Generated from the official v1 model by scripts/setup/setup_openarm_v1_scene.py.
  # It remains Git-ignored with the official OpenArm source checkout.
  mjcf_path: "third_party/openarm/openarm_mujoco/v1/openarm_bimanual_physical_scene.xml"
  cross_embodiment_mjcf_path: "third_party/mujoco_menagerie/cross_embodiment_openarm_ur5e_fr3.xml"
  sim_timestep: 0.002 # 500 Hz
  control_decimation: 5 # 100 Hz control loop
  render: false # default headless, set true for interactive viewer

# Fixed physical workcell geometry. World frame: +x forward, +y left, +z up.
workcell:
  arm_mount_height_m: 1.330
  torso:
    profile_width_m: 0.060
    height_m: 1.420
  table:
    top_height_m: 0.750
    top_thickness_m: 0.040
    # Provisional footprint, centered in front of the torso; replace with measurements.
    length_m: 1.200
    width_m: 0.800
    center_x_m: 0.650
  pick_place_demo:
    block_size_m: [0.040, 0.050, 0.100]
    cube_center_m: [0.259, 0.194, 0.800]
    place_zone_center_m: [0.200, 0.250, 0.750]
    top_approach_clearance_m: 0.150
    lateral_raise_tcp_m: [0.250, 0.500, 1.050]
  rgb_camera:
    model: "HBV HD CAMERA"
    offset_forward_from_torso_m: 0.070
    height_above_torso_m: 0.180
    downward_pitch_deg: 20.0
    fovy_deg: 70.0 # provisional; replace after intrinsic calibration

cross_embodiment:
  mode: "visual_only"
  source_robot: "OpenArm v1 parallel-link, 7 DOF per arm"
  target_robots:
    - "UR5e, 6 DOF per arm"
    - "Franka FR3, 7 DOF per arm"
  transfer_representation: "Canonical task-frame TCP pose targets; never direct joint-angle transfer."

# Arm enablement. Only the left arm is operable on the real robot. The right arm has a known
# hardware problem and stays disabled; its settings are kept for when it is fixed (see agents.md rule 6).
hardware:
  left:
    enabled: true
  right:
    enabled: false  # known hardware problem; do not enable until re-verified

# Cross-embodiment demo (simulation only): FR3 and UR5e run the same weigh-by-touch task as the real
# OpenArm, each on its own table with its own cans. They may "cheat": object positions come straight
# from this config, not from vision. Every robot works with its LEFT arm, like the real OpenArm, and each
# station is laid out the same way relative to that arm; the other arm is parked as its mirror image.
cross_embodiment_demo:
  sim_robots: [ur5e, fr3]
  control_dt_s: 0.01          # task/control tick; physics timestep comes from the scene (0.001 s)
  can:                        # two identical-looking cans; only the mass differs
    radius_m: 0.033
    half_height_m: 0.06
    empty_kg: 0.06
    full_kg: 0.36
    friction: 1.2
  table:
    center_x_m: 0.50
    half_x_m: 0.30
    half_y_m: 0.32
    top_z_m: 0.74
  grasp:
    approach_clearance_m: 0.12   # pre-grasp stand-off along the approach direction (+x)
    lift_height_m: 0.16
    max_joint_speed_rad_s: 0.8
    settle_s: 1.0
    weigh_window_s: 1.0
  stations:                   # world frame; y0 is the table centre line. Same layout relative to each left arm:
    ur5e:                     # (FR3 left arm base at y = -1.32, UR5e left arm base at y = +1.38)
      arm: left
      y0_m: 1.55
      cans_xy_m: [[0.50, 1.48], [0.45, 1.62]]
      full_can: 1             # which can is full (1 or 2)
      bins_xy_m: {heavy: [0.50, 1.37], light: [0.50, 1.73]}
      handover_xyz_m: [0.42, 1.55, 1.15]
      ending: handover        # sort | handover
    fr3:
      arm: left
      y0_m: -1.15
      cans_xy_m: [[0.50, -1.22], [0.45, -1.08]]
      full_can: 2
      bins_xy_m: {heavy: [0.50, -1.33], light: [0.50, -0.97]}
      handover_xyz_m: [0.42, -1.15, 1.15]
      ending: sort
